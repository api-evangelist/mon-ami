name: Mon Ami
description: >-
  Mon Ami is a modern data-management platform for aging and disability services,
  unifying case management, billing, evidence-based assessments, reporting, and
  compliance in one system. It serves State Units on Aging (SUAs), Area Agencies on
  Aging (AAAs), Intellectual & Developmental Disabilities (I/DD) programs,
  Long-Term Care Ombudsman offices, Medicaid HCBS providers, and Community Care Hubs.
  Mon Ami exposes a REST API (clients, care plans, services, copays, documents,
  programs, people, volunteers, referrals, tasks, visits, and webhooks) and treats
  interoperability as a design standard with open REST, HL7 FHIR R4, and secure SFTP.
  The platform is HIPAA and SOC 2 Type II certified and FedRAMP Ready.
