info:
  title: Mon Ami REST API
  version: '1.0'
  description: >-
    The Mon Ami REST API provides programmatic access to the Mon Ami platform for
    aging and disability services: clients, care plans, services and rates, copays
    and funding sources, documents (including InterRAI iCodes), programs and
    enrollments, people and volunteers, provider referrals, tasks, visits, client
    calls, sites, and webhook subscriptions. Interoperability is a design standard
    (open REST API, HL7 FHIR R4, secure SFTP). Contact Mon Ami to obtain API
    credentials.
  contact:
    name: Mon Ami
    url: https://docs.monami.io/
  termsOfService: https://www.monami.io/terms-of-use
servers:
  - url: https://app.monami.io/api
    description: Production
