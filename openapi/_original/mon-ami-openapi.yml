components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic authentication using your API uid and secret
        (Authorization: Basic base64(uid:secret)). Contact Mon Ami to obtain credentials.
  parameters:
    page:
      name: page
      in: query
      description: Page number (default 1).
      schema: { type: integer, default: 1, minimum: 1 }
    perPage:
      name: per_page
      in: query
      description: Results per page (default 25, max 50).
      schema: { type: integer, default: 25, maximum: 50 }
    q:
      name: q
      in: query
      description: >-
        Filter object. Filters nest under a single q parameter using q[field]=value
        (or q[field][]=v1&q[field][]=v2 for multiple values).
      style: deepObject
      explode: true
      schema: { type: object, additionalProperties: true }
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    clientId:
      name: client_id
      in: path
      required: true
      schema: { type: string }
    carePlanId:
      name: care_plan_id
      in: path
      required: true
      schema: { type: string }
  requestBodies:
    ResourceBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Resource' }
  responses:
    CollectionResponse:
      description: A paginated collection.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Collection' }
    ResourceResponse:
      description: A single resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Resource' }
    Unauthorized:
      description: Your API credentials are wrong.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The specified record could not be found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: The request has invalid parameters. See error messages in response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: You are requesting too many records. Slow down.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Resource:
      type: object
      description: A Mon Ami resource object. Field-level schema is not published; id is present on persisted resources.
      properties:
        id: { type: string }
      additionalProperties: true
    Collection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        links:
          type: object
          description: Pagination navigation URLs.
          additionalProperties: true
        meta:
          type: object
          description: Pagination metadata including total page counts.
          additionalProperties: true
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message: { type: string }
